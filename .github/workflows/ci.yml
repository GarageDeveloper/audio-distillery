name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend install
        run: npm ci

      # The tauri-build script requires the ffmpeg sidecar declared in
      # externalBin to exist, even to compile tests.
      - name: Fetch ffmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs

      # ASIO input backend (#9): Steinberg's SDK cannot be redistributed,
      # so it is fetched at build time. If the download fails the build
      # simply proceeds without the asio feature.
      - name: Fetch ASIO SDK (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $dir = Get-ChildItem asiosdk -Directory | Select-Object -First 1
          "CPAL_ASIO_DIR=$($dir.FullName)" | Out-File -Append $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      - name: Backend tests (core + app)
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$CPAL_ASIO_DIR" ]; then
            cargo test --workspace --features asio
          else
            cargo test --workspace
          fi

      - name: Frontend tests
        run: npm test

      - name: Frontend build (type-check + bundle)
        run: npm run build
