# Build installable apps (the downloadable artifacts).
#
#   - push to `main`        -> smoke set: macOS ARM64 + Linux x64
#   - push a tag `v*`       -> FULL set (all platforms) for a release
#   - manual "Run workflow" -> smoke by default; tick "all_platforms" for full
#
# On tag builds the macOS artifacts are signed with the Developer ID and
# notarized via the App Store Connect API key. Required repository secrets:
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_ISSUER, APPLE_API_KEY,
# APPLE_API_KEY_P8_BASE64. Forks without these secrets still get untagged
# smoke builds — signing steps only run on tags. Per-push safety net: ci.yml.
#
# ffmpeg is fetched as a static sidecar by scripts/fetch-ffmpeg.mjs, which
# runs from tauri.conf.json's beforeBuildCommand — nothing CI-specific.

name: Build apps

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build ALL platforms (default: macOS ARM64 + Linux x64)"
        type: boolean
        default: false
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          FULL='{"include":[
            {"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"name":"windows-arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc"},
            {"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"macos-x64-legacy","os":"macos-latest","target":"x86_64-apple-darwin"},
            {"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"name":"linux-arm64","os":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"}
          ]}'
          SMOKE='{"include":[
            {"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}
          ]}'
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event.inputs.all_platforms }}" = "true" ]; then
            MATRIX="$FULL"
          else
            MATRIX="$SMOKE"
          fi
          echo "matrix=$(echo "$MATRIX" | tr -d '\n' | tr -s ' ')" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # draft release upload on tag builds
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain (+ target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libasound2-dev patchelf xdg-utils

      # Release signing (tag builds only): throwaway keychain + App Store
      # Connect API key. Cleaned up by the last step (always()).
      - name: Set up macOS signing keychain
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/still-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_P12="$RUNNER_TEMP/certificate.p12"
          API_KEY="$RUNNER_TEMP/AuthKey.p8"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          rm -f "$CERT_P12"
          {
            echo "SIGN_KEYCHAIN=$KEYCHAIN"
            echo "APPLE_API_KEY_PATH=$API_KEY"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
          } >> "$GITHUB_ENV"

      # macOS bundles only the .app here (Tauri's bundle_dmg.sh needs Finder,
      # which hangs headless); the DMG is packaged by dmgbuild below. On tag
      # builds the env exported above makes Tauri sign (hardened runtime) and
      # notarize+staple the .app — the ffmpeg sidecar included.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}${{ runner.os == 'macOS' && ' --bundles app' || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('AudioDistillery {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Resolve macOS DMG names
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="smoke"; fi
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) ARCH="x86_64-legacy"; VOL="AudioDistillery ${VER} (Intel)" ;;
            *)                   ARCH="aarch64";       VOL="AudioDistillery ${VER}" ;;
          esac
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          {
            echo "MAC_VER=$VER"
            echo "MAC_VOL=$VOL"
            echo "MAC_APP=$BUNDLE/macos/AudioDistillery.app"
            echo "MAC_DMG=$BUNDLE/dmg/AudioDistillery_${VER}_${ARCH}.dmg"
          } >> "$GITHUB_ENV"

      # /usr/bin/python3 (Xcode CLT) on purpose: guaranteed SSL support.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          /usr/bin/python3 -c "import dmgbuild" 2>/dev/null \
            || /usr/bin/python3 -m pip install --user --quiet dmgbuild
          mkdir -p "$(dirname "$MAC_DMG")"
          /usr/bin/python3 -m dmgbuild -s packaging/dmg/settings.py \
            -D "app=$MAC_APP" "$MAC_VOL" "$MAC_DMG"

      - name: Sign, notarize & staple the DMG (tags)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" "$MAC_DMG"
          xcrun notarytool submit "$MAC_DMG" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --team-id "$APPLE_TEAM_ID" \
            --timeout 1h --wait
          xcrun stapler staple "$MAC_DMG"

      - name: Verify signature & notarization (tags)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$MAC_APP"
          spctl --assess -t exec -vvv "$MAC_APP" 2>&1 | tee /tmp/spctl-app.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl-app.txt
          xcrun stapler validate "$MAC_APP"
          xcrun stapler validate "$MAC_DMG"
          spctl --assess -t open --context context:primary-signature -vvv "$MAC_DMG"

      - name: Attach DMG to the draft release (tags)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -q ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -1)
          if [ -z "$REL_ID" ]; then
            echo "::error::no release found for tag ${GITHUB_REF_NAME}"; exit 1
          fi
          NAME=$(basename "$MAC_DMG")
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=${NAME}" \
            --input "$MAC_DMG"

      # On tag builds the installers are already attached to the release;
      # this workflow-artifact copy is a convenience, so a storage-quota
      # failure must not paint the whole release run red.
      - name: Upload artifact
        continue-on-error: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: audiodistillery-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Clean up signing material
        if: always() && runner.os == 'macOS' && github.ref_type == 'tag'
        run: |
          [ -n "${SIGN_KEYCHAIN:-}" ] && security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          [ -n "${APPLE_API_KEY_PATH:-}" ] && rm -f "$APPLE_API_KEY_PATH" || true
          rm -f "$RUNNER_TEMP/certificate.p12" || true
          echo "signing material cleaned"
