[package]
name = "still"
version = "0.1.0"
description = "AudioDistillery — non-destructive audio splitting workshop"
authors = ["Raphaël Enrici"]
edition = "2021"
license = "MIT"

[workspace]
members = ["core", "ddp-fileset"]

[lib]
name = "still_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The product name is what macOS shows in Cmd-Tab/Dock for the dev process,
# so the binary carries it (the "still" short name remains the technical id:
# crate names, .still extension, window labels).
[[bin]]
name = "AudioDistillery"
path = "src/main.rs"


[features]
# Forwarded to still-core: ASIO input backend on Windows.
asio = ["still-core/asio"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
still-core = { path = "core" }
libc = "0.2"
