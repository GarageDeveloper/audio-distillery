[package]
name = "still-core"
version = "0.1.0"
description = "AudioDistillery core — pure business logic, no Tauri dependency"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
symphonia = { version = "0.5", features = ["all"] }
ts-rs = { version = "10", features = ["serde-compat"] }
lofty = "0.25"
ddp-fileset = { path = "../ddp-fileset" }
cpal = "0.15"
rtrb = "0.3"
ebur128 = "0.1.10"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"
vst3 = "0.3"
libloading = "0.8"

[dev-dependencies]
hound = "3"
tempfile = "3"
